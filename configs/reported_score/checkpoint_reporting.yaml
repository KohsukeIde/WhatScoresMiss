  datasets:
    - SCANOBJECTNN_ROOT
  checkpoints:
    - POINTGPT_CKPT
    - POINTMAE_CKPT
    - PCPMAE_CKPT
splits:
  - obj_bg
  - obj_only
  - pb_t50_rs
protocols:
  - standard
  - heldout_selection
metric: top1_accuracy
